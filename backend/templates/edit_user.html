
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User | EMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3f5f9;
            color: #1e293b;
            padding: 35px 20px;
        }

        .page-container {
            max-width: 750px;
            margin: auto;
        }

        .header {
            background: #172554;
            color: white;
            padding: 25px 30px;
            border-radius: 12px 12px 0 0;
        }

        .header h1 {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .header p {
            font-size: 13px;
            color: #cbd5e1;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.07);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 22px;
            color: #1d4ed8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .section-title {
            color: #172554;
            font-size: 19px;
            margin-bottom: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            text-align: center;
        }

        .update-btn {
            background: #1e3a8a;
            color: white;
        }

        .update-btn:hover {
            background: #1e40af;
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
        }

        @media (max-width: 550px) {
            body {
                padding: 20px 12px;
            }

            .header, .form-card {
                padding: 22px 18px;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <main class="page-container">

        <div class="header">
            <h1>Edit User</h1>
            <p>Update system user account information.</p>
        </div>

        <div class="form-card">

            <a href="{{ url_for('users') }}" class="back-link">
                ← Back to User Management
            </a>

            <h2 class="section-title">Update User Details</h2>

            <form method="POST">

                <div class="form-group">
                    <label>Username</label>
                    <input
                        type="text"
                        name="username"
                        value="{{ user.username }}"
                        maxlength="50"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Employee</label>

                    <select name="employee_id">
                        <option value="">No Employee Link</option>

                        {% for employee in employees %}
                        <option
                            value="{{ employee.employee_id }}"
                            {% if user.employee_id == employee.employee_id %}selected{% endif %}
                        >
                            {{ employee.employee_code }} -
                            {{ employee.first_name }} {{ employee.last_name or '' }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>User Role</label>

                    <select name="role" required>
                        <option value="Employee"
                            {% if user.role == 'Employee' %}selected{% endif %}>
                            Employee
                        </option>

                        <option value="HR"
                            {% if user.role == 'HR' %}selected{% endif %}>
                            HR
                        </option>

                        <option value="Admin"
                            {% if user.role == 'Admin' %}selected{% endif %}>
                            Admin
                        </option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn update-btn">
                        Update User
                    </button>

                    <a href="{{ url_for('users') }}" class="btn cancel-btn">
                        Cancel
                    </a>
                </div>

            </form>

        </div>

    </main>

</body>
</html>
